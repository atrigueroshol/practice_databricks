bundle:
  name: dea_practice
variables:
  catalog:
    description: Catálogo UC autorizado
  schema:
    description: Schema exclusivo de prácticas, creado por notebook 24
resources:
  jobs:
    medallion_job:
      name: dea_medallion
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: fail_silver
          default: "false"
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./job_task.py
            base_parameters:
              stage: bronze
          max_retries: 1
          min_retry_interval_millis: 10000
        - task_key: has_rows
          depends_on:
            - task_key: bronze
          condition_task:
            op: GREATER_THAN
            left: "{{tasks.bronze.values.rows}}"
            right: "0"
        - task_key: silver
          depends_on:
            - task_key: has_rows
              outcome: "true"
          notebook_task:
            notebook_path: ./job_task.py
            base_parameters:
              stage: silver
          max_retries: 1
          min_retry_interval_millis: 10000
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./job_task.py
            base_parameters:
              stage: gold
        - task_key: dates
          depends_on:
            - task_key: gold
          for_each_task:
            inputs: '["2026-01-01", "2026-01-02"]'
            concurrency: 1
            task:
              task_key: process_date
              notebook_task:
                notebook_path: ./job_task.py
                base_parameters:
                  stage: dates
                  process_date: "{{input}}"
      # Sin cluster: tareas de notebook en serverless.
      # Requiere serverless habilitado y permisos de la identidad del job.
targets:
  dev:
    default: true
    mode: development
  test:
    mode: development
    resources:
      jobs:
        medallion_job:
          name: dea_medallion_test
